[project]
name = "lanyon"
version = "0.1.0"
description = "A freeform, Liquid-templated static site generator."
requires-python = ">=3.10"
dependencies = [
    "python-liquid>=1.12",
    "PyYAML>=6.0",
]

[project.scripts]
lanyon = "lanyon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
