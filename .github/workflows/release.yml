name: Release

# Fires on version tags (v1.2.3) and does two independent things:
#   1. builds the single-file `lanyon` binary for linux/amd64 and
#      linux/arm64 with PyInstaller and attaches both to a GitHub Release
#   2. builds and pushes a multi-arch (amd64+arm64) runtime image to
#      ghcr.io/<owner>/<repo>, using docker/Dockerfile as-is
#
# Tag and push a release with:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # Native ARM64 GitHub-hosted runner - PyInstaller doesn't
            # cross-compile, so arm64 needs to actually run on arm64.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name lanyon src/lanyon_entry.py

      - name: Rename artifact
        run: mv dist/lanyon dist/lanyon-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: lanyon-linux-${{ matrix.arch }}
          path: dist/lanyon-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum lanyon-linux-* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
